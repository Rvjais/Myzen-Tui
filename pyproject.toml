requires-python = ">=3.10"
dependencies = ["textual"]
authors = [{name = "Ranveer Jaiswal", email = "ranveer.jaiswal@brandingpioneers.co.in"}]

[project.urls]
Homepage = "https://github.com/Rvjais/Myzen-Tui"

[project.scripts]
myzen-tui = "myzen_tui:main"
